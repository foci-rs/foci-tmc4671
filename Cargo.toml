[package]
name = "foci-tmc4671"
version = "0.4.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "TMC4671 FOC servo controller driver"
repository = "https://github.com/foci-rs/foci-tmc4671"

[dependencies]
bitfield-struct = "0.9"
defmt = "1.0"
embedded-hal = "1.0"
embedded-hal-async = "1.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11", features = ["eh1"] }
pollster = "0.4"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Lints that fire in this crate today; drop an entry once its findings are fixed.
decimal_bitwise_operands = "allow"
must_use_candidate = "allow"
unused_async_trait_impl = "allow"
