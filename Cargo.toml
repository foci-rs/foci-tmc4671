[package]
name = "foci-tmc4671"
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "TMC4671 FOC servo controller driver"
repository = "https://github.com/foci-rs/foci-tmc4671"

[dependencies]
bitfield-struct = "0.9"
defmt = "1.0"
embedded-hal = "1.0"
embedded-hal-async = "1.0"

[dev-dependencies]
embedded-hal-mock = { version = "0.11", features = ["eh1"] }
pollster = "0.4"
